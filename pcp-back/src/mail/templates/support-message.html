<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>Support Message</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f6f6f6; padding: 20px;">
<div style="max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 6px;">
	<h2>New Support Request</h2>
	<p><strong>From:</strong> <a href="mailto:{{email}}">{{email}}</a></p>
	<p><strong>Subject:</strong> {{subject}}</p>
	<p>{{message}}</p>

	<hr style="margin: 30px 0;" />

	<p style="font-size: 12px; color: #999;">
		This message was automatically generated from the support form.
	</p>
</div>
</body>
</html>
